services:
  - type: web
    name: spendsmart-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install --include=dev && npx puppeteer browsers install chrome && npm run build
    startCommand: npm run start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
